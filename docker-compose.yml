# ── BodyTrack yerel geliştirme ortamı ──
# Üç servis: PostgreSQL (veri), Redis (cache/kuyruk), backend (FastAPI).
# Çalıştır:  docker compose up --build

services:
  db:
    # DİKKAT: alpine DEĞİL. postgres:16-alpine musl libc kullanır ve orada
    # C.UTF-8 locale'i yoktur — sessizce "C"ye düşer. C collation'da harf
    # katlama sadece ASCII'de çalışır: lower('GÖĞÜS') = 'gÖĞÜs' olur ve
    # Türkçe egzersiz araması tamamen bozulur. Debian tabanlı imaj glibc
    # kullandığı için C.UTF-8 düzgün çalışır.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodytrack}
      POSTGRES_DB: ${POSTGRES_DB:-bodytrack}
      # Collation'ı şansa bırakma. İki yönlü risk var:
      #  • tr_TR ile kurulursa Türkçe harf kuralları devreye girer:
      #    lower('I') = 'ı' olur, lower('INCLINE') = 'ınclıne' olur —
      #    CITEXT email eşleşmesi ve İngilizce arama bozulur.
      #  • C (UTF-8'siz) ile kurulursa katlama sadece ASCII'de çalışır:
      #    lower('GÖĞÜS') = 'gÖĞÜs' olur, Türkçe arama bozulur.
      # C.UTF-8 ikisinin arasında doğru yeri tutar: Unicode varsayılanı.
      # DİKKAT: collation'ı sonradan değiştirmek tüm veritabanını
      # dump/restore etmek demektir; bu satır o yüzden burada.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOT: db burada boş başlar. Tabloları + seed verisini (17 kas grubu,
      # 20 egzersiz) backend servisinin başlangıç komutu (`alembic upgrade
      # head`, bkz. backend/Dockerfile) kurar — artık tek gerçek kaynak
      # Alembic migration'ları, db/schema_v1.sql değil (bkz. CLAUDE.md
      # "Şema değiştirme prosedürü"). Şemayı sıfırdan kurmak istersen
      # `docker compose down -v` ile volume'ü sil, backend yeniden başlarken
      # migration'ları otomatik uygular.
    healthcheck:
      # backend, db "healthy" olana kadar beklesin (aşağıdaki depends_on)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bodytrack}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      # dev hedefi: üretim imajının üzerine pytest/ruff/mypy ekler.
      # Testler: docker compose exec backend pytest
      target: dev
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Kod değişikliklerini canlı yansıt (Dockerfile'daki --reload ile birlikte)
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: