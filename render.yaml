# Render Blueprint for the BODYTRACK STAGING API (optional; the same settings can be entered by
# hand in the dashboard, see README.md, "Staging'e dağıtım").
#
# NOT validated against Render (that needs an account), and nothing here has been deployed.
# No secret belongs in this file: every `sync: false` value is typed into the dashboard
# when the Blueprint is first applied, and JWT_SECRET_KEY is generated by Render.
services:
  - type: web
    name: bodytrack-staging-api
    runtime: docker
    plan: free
    # Keep the web service, Neon and Upstash in the same region (Frankfurt for all three).
    region: frankfurt
    # Render builds the LAST stage of the Dockerfile; that is the "production" stage.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness only: it never touches the database or Redis, so Render's probes do not wake
    # the suspended Neon compute or spend Upstash commands.
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: JWT_SECRET_KEY
        generateValue: true
      # Secrets and provider values: entered in the dashboard, never committed.
      - key: DATABASE_URL # postgresql+asyncpg://USER:PASSWORD@HOST/DB?ssl=verify-full (direct host)
        sync: false
      - key: REDIS_URL # rediss://default:TOKEN@HOST:6379
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM # an address on a domain verified in Resend
        sync: false
      - key: MAIL_TRANSPORT
        value: resend
      # Small-instance settings (free web service: a fraction of a CPU, 512 MB).
      - key: PASSWORD_WORK_WORKERS
        value: "2"
      - key: PASSWORD_WORK_MAX_QUEUED
        value: "16"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: RUN_MIGRATIONS
        value: "true"
