# Password recovery in the real app on the isolated E2E stack.
#
# One disposable account that has forgotten its password: Forgot password? -> the address ->
# a wrong code is refused (and the form keeps what was typed) -> the code the server really
# emailed is read from the isolated test inbox (helpers/read-recovery-code.js) and typed in ->
# the new password -> "Password updated" -> back at sign-in with a notice -> the OLD password
# is refused -> the NEW one signs in. Nothing in the app or server is bypassed: the code is
# checked by the server like any other.
# What this flow cannot see (the old tokens being dead on the server, the mailbox contents,
# the notification mail, the replayed code being refused, an unknown address getting the same
# answer) is checked by e2e/scripts/recovery.sh through the API and the inbox afterwards.
# Started by that script, which creates the account and the environment.
# The Expo Go introduction handling is copied from account-deletion.yaml.
appId: host.exp.Exponent
---
- launchApp
- openLink: ${METRO_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 180000
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - tapOn: "Close"
      - tapOn: "Gear Shape, Filled"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - scrollUntilVisible:
          element: "Tools button"
          timeout: 15000
      - tapOn:
          text: "1"
          rightOf: "Tools button"
          index: 1
      - tapOn: "Close"

# ── 1. from sign-in to the recovery screen ──
- scrollUntilVisible:
    element:
      id: "login-forgot"
    timeout: 15000
- tapOn:
    id: "login-forgot"
- extendedWaitUntil:
    visible: "Reset your password"
    timeout: 10000

# ── 2. an empty address is refused on the device; then ask for the code ──
- tapOn:
    id: "recovery-send"
- extendedWaitUntil:
    visible: "Enter your email address."
    timeout: 10000
- tapOn:
    id: "recovery-email"
- inputText: ${E2E_EMAIL}
# The keyboard's Send key asks for the code, as the button does.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 30000
# The wording claims nothing about the address.
- assertVisible: ".*If an account exists for.*"

# ── 3. a mismatch is shown as typed; a wrong code is refused and nothing is lost ──
- tapOn:
    id: "recovery-code"
- inputText: "00000000"
- tapOn:
    id: "recovery-password"
- inputText: ${E2E_NEW_PASSWORD}
# The keyboard's Next key moves to the confirmation (and scrolls it above the keyboard);
# tapping its place would hit the keyboard, which covers that field.
- pressKey: Enter
- inputText: "not-the-same-1"
- assertVisible: "The two passwords do not match."
- eraseText:
    charactersToErase: 30
- inputText: ${E2E_NEW_PASSWORD}
- assertNotVisible: "The two passwords do not match."
# Go key on the last field submits.
- pressKey: Enter
- extendedWaitUntil:
    visible: "That code is not valid.*"
    timeout: 30000
# Still on the same step, still signed out.
- assertVisible:
    id: "recovery-code"
- assertNotVisible: "Password updated"

# ── 4. the real code, read from the isolated inbox ──
- runScript:
    file: helpers/read-recovery-code.js
    env:
      MAIL_API: ${MAIL_API}
      E2E_EMAIL: ${E2E_EMAIL}
- tapOn:
    id: "recovery-code"
- eraseText:
    charactersToErase: 20
- inputText: ${output.code}
# The number pad has no return key and hideKeyboard cannot close it: a tap on plain text
# (not handled by any control) dismisses it, then the button is reachable.
- tapOn: "Choose a new password"
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 60000
- assertNotVisible: "Profile, tab.*"

# ── 5. back at sign-in: the notice, the old password refused, the new one accepted ──
- tapOn:
    id: "recovery-done"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 20000
- assertVisible: "Your password was changed.*"
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${E2E_OLD_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Invalid email or password"
    timeout: 30000
- assertNotVisible: "Profile, tab.*"
# The cursor goes to the end of the old password (right of its text, left of the eye).
- tapOn:
    id: "login-password"
    point: "80%,50%"
- eraseText:
    charactersToErase: 80
- inputText: ${E2E_NEW_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Profile, tab.*"
    timeout: 60000
