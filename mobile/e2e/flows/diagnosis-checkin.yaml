# "Why am I not growing?" on one simulator, three accounts taking turns:
#  (a) EMPTY   the assessment with no records -> the standalone daily check-in -> save ->
#              back on the refreshed assessment (no workout may exist afterwards; the
#              script checks that through the API).
#  (b) HISTORY the assessment with four completed weeks of training, five nights of sleep
#              and four weigh-ins -> period change 4 -> 8 -> 12 weeks -> an action that
#              opens an existing screen and back.
#  (c) FRESH   the existing pre-workout check-in still starts the workout.
# Started by e2e/scripts/diagnosis.sh, which creates the fixtures (never by waiting for
# real weeks). Every step is a real tap or text entry. Self-contained on purpose (the Expo
# Go introduction handling is copied from smoke-workout.yaml). One simulator, accounts in
# sequence: not three devices at once.
appId: host.exp.Exponent
---
- launchApp
- openLink: ${METRO_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 180000
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - tapOn: "Close"
      - tapOn: "Gear Shape, Filled"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - scrollUntilVisible:
          element: "Tools button"
          timeout: 15000
      - tapOn:
          text: "1"
          rightOf: "Tools button"
          index: 1
      - tapOn: "Close"

# ══ (a) EMPTY: no records -> standalone daily check-in ══
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL_EMPTY}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD_EMPTY}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Volume, tab.*"
    timeout: 30000
- tapOn: "Volume, tab.*"
# The entry card's two lines are one accessibility element, so match by its first line.
- extendedWaitUntil:
    visible: "Why am I not growing.*"
    timeout: 15000
- tapOn: "Why am I not growing.*"
- extendedWaitUntil:
    visible: "Training: No records"
    timeout: 20000
- assertVisible: "Sleep: No records"
- assertVisible: ".*0 of 3 have enough records for the last 4 weeks.*"
# No goal is set, so weight is "Not applicable" (and its card still says no weigh-ins exist).
- scrollUntilVisible:
    element: "Body weight: Not applicable"
    timeout: 15000
- scrollUntilVisible:
    element: "Not enough records to say anything yet"
    timeout: 15000
- takeScreenshot: a1-empty-assessment
- scrollUntilVisible:
    element: "Log today's sleep"
    direction: UP
    timeout: 15000
- tapOn: "Log today's sleep"
- extendedWaitUntil:
    visible: "Today's check-in"
    timeout: 15000
- takeScreenshot: a2-daily-checkin
- tapOn: "Sleep in hours"
- inputText: "7.5"
# A decimal pad has no return key: tapping the title is how the keyboard goes away.
- tapOn: "Today's check-in"
- tapOn: "Energy, 4 of 5"
- takeScreenshot: a3-filled
- tapOn: "Save check-in"
# Back on the assessment, which has reloaded: one recorded night is still too few.
- extendedWaitUntil:
    visible: "Sleep: Not enough records"
    timeout: 20000
- assertVisible: "Training: No records"
- takeScreenshot: a4-after-save
# The check-in is also reachable from Profile.
- tapOn: "Back"
- tapOn: "Profile, tab.*"
- scrollUntilVisible:
    element: "Daily check-in.*"
    timeout: 15000
- takeScreenshot: a5-profile-entry
- scrollUntilVisible:
    element: "Sign out"
    timeout: 15000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 15000

# ══ (b) HISTORY: sufficient records -> period change -> an action ══
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL_HISTORY}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD_HISTORY}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Volume, tab.*"
    timeout: 30000
- tapOn: "Volume, tab.*"
# The entry card's two lines are one accessibility element, so match by its first line.
- extendedWaitUntil:
    visible: "Why am I not growing.*"
    timeout: 15000
- tapOn: "Why am I not growing.*"
- extendedWaitUntil:
    visible: "Training: Enough records"
    timeout: 20000
- assertVisible: "Sleep: Enough records"
- assertVisible: ".*3 of 3 have enough records for the last 4 weeks.*"
- takeScreenshot: b1-history-4-weeks
- scrollUntilVisible:
    element: "Body weight: Enough records"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Worth checking.*"
    timeout: 15000
- takeScreenshot: b2-observations
- scrollUntilVisible:
    element: "8 weeks"
    direction: UP
    timeout: 15000
- tapOn: "8 weeks"
- extendedWaitUntil:
    visible: ".*3 of 3 have enough records for the last 8 weeks.*"
    timeout: 20000
- takeScreenshot: b3-8-weeks
- tapOn: "12 weeks"
- extendedWaitUntil:
    visible: ".*3 of 3 have enough records for the last 12 weeks.*"
    timeout: 20000
- takeScreenshot: b4-12-weeks
# An action leads to an existing screen: the weigh-in history, then back.
- scrollUntilVisible:
    element: "Open weight history"
    timeout: 20000
- tapOn: "Open weight history"
- extendedWaitUntil:
    visible: "Weight History"
    timeout: 15000
- takeScreenshot: b5-weight-history
- tapOn: "Back"
- extendedWaitUntil:
    visible: "What was evaluated"
    timeout: 15000
- tapOn: "Back"
- tapOn: "Profile, tab.*"
- scrollUntilVisible:
    element: "Sign out"
    timeout: 15000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 15000

# ══ (c) FRESH: the pre-workout check-in still starts the workout ══
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL_FRESH}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD_FRESH}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Start workout"
    timeout: 30000
- tapOn: "Start workout"
- extendedWaitUntil:
    visible: "How are you feeling today?"
    timeout: 15000
- tapOn: "Sleep in hours"
- inputText: "6.5"
- tapOn: "How are you feeling today?"
- takeScreenshot: c1-pre-workout-checkin
- tapOn: "Continue to workout"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- takeScreenshot: c2-workout-started
