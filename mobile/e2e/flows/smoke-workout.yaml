appId: host.exp.Exponent
---
- launchApp
- openLink: ${METRO_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 180000
- takeScreenshot: 01-sign-in

# Expo Go shows its developer-menu introduction once per install, on top of the app.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      # The introduction opens the developer menu; close it to reach the app.
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - tapOn: "Close"
      # The tools button Expo Go floats over the app sits on top of the header actions
      # (it would take the tap meant for "Finish workout"). The introduction's copy of
      # the menu closes on any tap, so reopen the menu and switch the button off there.
      - tapOn: "Gear Shape, Filled"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      # The menu opens as a half-height sheet; the row has to be scrolled into view,
      # otherwise the tap lands outside the sheet and dismisses it.
      - scrollUntilVisible:
          element: "Tools button"
          timeout: 15000
      # Index 1 is the switch itself; index 0 is the wider row element around it.
      - tapOn:
          text: "1"
          rightOf: "Tools button"
          index: 1
      - tapOn: "Close"
- takeScreenshot: 01a-after-intro

# ── sign in ──
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD}
- takeScreenshot: 02-credentials-entered
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "Start workout"
    timeout: 30000
- takeScreenshot: 03-training

# ── start a workout ──
- tapOn: "Start workout"
- extendedWaitUntil:
    visible: "How are you feeling today?"
    timeout: 15000
- takeScreenshot: 04-check-in
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 15000
- takeScreenshot: 05-workout-empty

# ── record a set ──
- tapOn: "Add exercise"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 15000
- takeScreenshot: 06-picker
# The search field is focused automatically when the picker opens.
- inputText: "Barbell Bench"
- extendedWaitUntil:
    visible: "Barbell Bench Press.*"
    timeout: 15000
# The row's accessible name also carries its "barbell · compound" subtitle.
- tapOn: "Barbell Bench Press.*"
- extendedWaitUntil:
    visible: "Log set"
    timeout: 15000
- tapOn:
    id: "set-weight-input"
- inputText: "80"
- tapOn:
    id: "set-reps-input"
- inputText: "8"
# RIR is left blank on purpose.
# This flow needs the software keyboard (the simulator default without a hardware
# keyboard): it is what covers the form, and its Done key is what is under test.
- assertVisible: "Dictate"
# The keyboard slides up and the form is scrolled above it once it has arrived; wait for
# the screen to be still before looking at it or tapping (the form moves meanwhile).
- waitForAnimationToEnd
- takeScreenshot: 07-keyboard-open-form-visible

# The keyboard's Done only closes the keyboard: nothing is recorded, the draft stays.
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Dictate"
    timeout: 10000
- assertVisible: "0 working sets"
- assertNotVisible: "Set 1, .*"
- assertVisible:
    id: "set-weight-input"
    text: "80"
- assertVisible:
    id: "set-reps-input"
    text: "8"
- takeScreenshot: 08-after-done-nothing-recorded

# Log set is reachable with the keyboard open: bring the keyboard back and tap it.
# (An earlier Done-then-Log-set would have made two sets here; exactly one is expected.)
- tapOn:
    id: "set-reps-input"
- assertVisible: "Dictate"
- waitForAnimationToEnd
- tapOn: "Log set"
- extendedWaitUntil:
    visible: "Set 1, 80.* for 8 reps.*"
    timeout: 15000
- assertVisible: "1 working sets"
- assertNotVisible: "Set 2, .*"
- takeScreenshot: 09-one-set-recorded

# A second explicit save of identical values is a second set. The keyboard stays open
# after a save, so Log set is tapped with it open again.
- tapOn:
    id: "set-weight-input"
- inputText: "80"
- tapOn:
    id: "set-reps-input"
- inputText: "8"
- assertVisible: "Dictate"
- waitForAnimationToEnd
- takeScreenshot: 09b-second-set-keyboard-open
- tapOn: "Log set"
- extendedWaitUntil:
    visible: "Set 2, 80.* for 8 reps.*"
    timeout: 15000
- assertVisible: "2 working sets"
- takeScreenshot: 10-two-identical-sets

# ── edit: keyboard Done changes nothing until Save ──
# Saving a set replaces the form, which also closes the keyboard.
- extendedWaitUntil:
    notVisible: "Dictate"
    timeout: 10000
- tapOn: "Set 2, 80.* for 8 reps.*"
- extendedWaitUntil:
    visible: "Editing set 2"
    timeout: 10000
# The weight field is focused and selected when the editor opens.
- eraseText: 5
- inputText: "85"
# The number pad of the Reps field is the one with a Done key.
- tapOn:
    id: "edit-reps-input"
- extendedWaitUntil:
    visible: "Done"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 11-edit-keyboard-open-save-visible
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Dictate"
    timeout: 10000
# Still editing, draft kept, nothing saved: Cancel shows the original values.
- assertVisible: "Editing set 2"
- assertVisible:
    id: "edit-weight-input"
    text: "85"
- takeScreenshot: 12-edit-after-done
- tapOn: "Cancel editing"
- extendedWaitUntil:
    visible: "Set 2, 80.* for 8 reps.*"
    timeout: 10000
- assertNotVisible: "Set 2, 85.*"

# Edit again and save with the keyboard still open.
- tapOn: "Set 2, 80.* for 8 reps.*"
- extendedWaitUntil:
    visible: "Editing set 2"
    timeout: 10000
- eraseText: 5
- inputText: "85"
- waitForAnimationToEnd
- tapOn: "Save set"
- extendedWaitUntil:
    visible: "Set 2, 85.* for 8 reps.*"
    timeout: 15000
- assertVisible: "Set 1, 80.* for 8 reps.*"
- assertVisible: "2 working sets"
- takeScreenshot: 13-edit-saved

# ── finish through the confirmation ──
- tapOn: "Finish workout"
# The alert title ends in a question mark; the header button's name does not.
- extendedWaitUntil:
    visible: "Finish workout\\?"
    timeout: 10000
- takeScreenshot: 14-finish-confirmation
- tapOn: "Finish"

# ── reopen the completed workout from history ──
- extendedWaitUntil:
    visible: "Recent workouts"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*, 2 sets"
    timeout: 20000
- takeScreenshot: 15-history
- tapOn: ".*, 2 sets"
# The finished workout is read-only: the sets are shown as table cells, not as editable rows.
- extendedWaitUntil:
    visible: "Edit workout"
    timeout: 20000
- assertVisible: "Barbell Bench Press"
- assertVisible: "2 working sets"
- assertVisible: "80 kg"
- assertVisible: "85 kg"
- assertVisible: "× 8"
- takeScreenshot: 16-completed-workout
