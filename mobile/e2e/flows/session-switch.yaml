# Account A signs in, signs out, the app is relaunched WITHOUT clearing app storage
# or the keychain, and account B signs in. A's private data must not come back.
# Started by e2e/scripts/session.sh (two temporary accounts; A owns a finished and an
# unfinished workout). Native interaction only: no request is delayed or rewritten here.
appId: host.exp.Exponent
---
- launchApp
- openLink: ${METRO_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 180000

# Expo Go shows its developer-menu introduction once per install, on top of the app.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - tapOn: "Close"
      - tapOn: "Gear Shape, Filled"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: 10000
      - scrollUntilVisible:
          element: "Tools button"
          timeout: 15000
      - tapOn:
          text: "1"
          rightOf: "Tools button"
          index: 1
      - tapOn: "Close"

# ── account A signs in and sees its own data ──
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL_A}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD_A}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 30000
- assertVisible: "Alpha finished session.*"
- takeScreenshot: 01-a-signed-in

# ── A signs out ──
- tapOn: "Profile, tab.*"
- extendedWaitUntil:
    visible: ".*Alpha.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Sign out"
    timeout: 15000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 15000
- takeScreenshot: 02-a-signed-out

# ── relaunch: the app process is stopped and started again, nothing is cleared ──
- stopApp
- launchApp:
    clearState: false
    clearKeychain: false
- openLink: ${METRO_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find your strength."
    timeout: 180000
- assertNotVisible: "Resume workout"
- assertNotVisible: ".*Alpha finished session.*"
- takeScreenshot: 03-relaunched-still-signed-out

# ── account B signs in; nothing of A is shown ──
- tapOn:
    id: "login-email"
- inputText: ${E2E_EMAIL_B}
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD_B}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Start workout"
    timeout: 30000
- assertNotVisible: "Resume workout"
- assertNotVisible: "Workout in progress"
- assertNotVisible: ".*Alpha finished session.*"
- assertNotVisible: ".*Alpha open session.*"
- takeScreenshot: 04-b-signed-in-training
- tapOn: "Profile, tab.*"
- extendedWaitUntil:
    visible: ".*Bravo.*"
    timeout: 15000
- assertNotVisible: ".*Alpha.*"
- takeScreenshot: 05-b-profile
